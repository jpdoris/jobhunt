# Apache vhost — copy to /etc/apache2/sites-available/jobhunt.conf
#
# Apache already owns port 80, so it front-ends the Node app rather than Node
# binding a privileged port itself. Node stays unprivileged on 3000.
#
# Needs: sudo a2enmod proxy proxy_http
#
# Also requires `Listen 0.0.0.0:80` in /etc/apache2/ports.conf. Plain `Listen 80`
# binds the IPv6 wildcard, and WSL's relay then exposes the site on ::1 only —
# a 127.0.0.1 hosts entry would be refused. See README.

<VirtualHost *:80>
    ServerName jobhunt.test

    # Passes through Host: jobhunt.test rather than rewriting it to 127.0.0.1.
    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/

    ErrorLog  ${APACHE_LOG_DIR}/jobhunt-error.log
    CustomLog ${APACHE_LOG_DIR}/jobhunt-access.log combined
</VirtualHost>
